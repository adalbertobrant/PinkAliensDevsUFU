default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "antecipe_development" } %>

test:
  <<: *default
  database: antecipe_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "antecipe_production" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "antecipe" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
